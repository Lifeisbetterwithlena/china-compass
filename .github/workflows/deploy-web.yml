# Builds the Flutter web app and publishes it to GitHub Pages on every push to main.
name: Deploy web app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: china_compass
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Run tests
        run: flutter test

      # --no-web-resources-cdn: serve Flutter's engine files from this site, not from
      # Google's CDN, which is blocked in China.
      - name: Build web app
        run: >
          flutter build web --release
          --dart-define-from-file=supabase.json
          --base-href "/${{ github.event.repository.name }}/"
          --no-web-resources-cdn

      - uses: actions/upload-pages-artifact@v3
        with:
          path: china_compass/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
